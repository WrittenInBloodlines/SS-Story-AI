<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings • S•S Story AI</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/list.css"></head>
<body>
<header class="topbar"><a class="brand" href="../index.html">S•S <span>Story AI</span></a><a class="back" href="../index.html">← Home</a><span>Settings</span></header>
<main class="narrow"><div class="section-head"><div><p class="eyebrow">PREFERENCES</p><h1>Settings</h1></div></div>
<section class="panel settings-panel">
  <div class="setting-row"><span>Story length</span><button class="secondary" id="story-length">Very long</button></div>
  <div class="setting-row"><span>Creativity</span><button class="secondary" id="creativity">Controlled</button></div>
  <div class="setting-row"><span>Writing mode</span><button class="secondary" id="writing-mode">Story</button></div>
  <label class="setting-toggle"><input id="continuity" type="checkbox"> Continuity checks</label>
  <p id="settings-status" class="muted">Changes are saved automatically.</p>
</section>

<section class="panel settings-panel">
  <div class="section-head compact"><div><p class="eyebrow">LOCAL AI</p><h2>Gemma</h2></div></div>
  <div class="setting-row"><span id="gemma-status">No local model loaded</span><button class="secondary" id="gemma-pick">Choose model</button></div>
  <p class="muted">On Android, choose a compatible local Gemma model file. The model stays on the device.</p>
</section>
</main>
<script type="module" src="../assets/js/settings.js"></script>
</body></html>
