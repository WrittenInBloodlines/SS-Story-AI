<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat • S•S Story AI</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/chat.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html">S•S <span>Story AI</span></a>
    <span id="chat-title">Chat</span>
    <a class="back" href="project.html">Project</a>
  </header>

  <main class="chat-app">
    <aside class="chat-sidebar" aria-label="Chats">
      <div class="sidebar-header">
        <div>
          <span class="eyebrow">Project chats</span>
          <h1>Conversations</h1>
        </div>
        <button id="new-chat" class="icon-button" type="button" aria-label="Create a new chat">+</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <section class="chat-main">
      <div class="chat-main-header">
        <div>
          <span class="eyebrow">Story workspace</span>
          <strong id="chat-heading">Main Chat</strong>
        </div>
        <span id="chat-status" class="chat-status">Local draft</span>
      </div>

      <div id="continuity-warnings" class="continuity-panel" hidden></div>
      <div id="messages" class="messages">
        <div class="empty">
          <h2>Your Story Chat</h2>
          <p>Start writing. Messages are stored locally in this project.</p>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <textarea id="message" rows="2" placeholder="Write something..."></textarea>
        <div class="composer-footer">
          <span>Local chat storage is active</span>
          <button class="primary" type="submit">Send</button>
        </div>
      </form>
    </section>
  </main>

  <script type="module" src="../assets/js/chat.js"></script>
</body>
</html>
