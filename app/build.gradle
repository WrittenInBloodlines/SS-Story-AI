plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ssstoryai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ssstoryai.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.webkit:webkit:1.12.1'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

// The Android app is a wrapper around the existing S•S Story AI web UI.
// The web files are copied at build time, so there is only one source of truth.
tasks.register('syncWebAssets', Sync) {
    into(layout.projectDirectory.dir('src/main/assets'))
    from(rootProject.projectDir) {
        include '**/*'
        exclude '.git/**', '.github/**', '.gradle/**', 'app/**', 'build/**', 'tools/**'
        exclude 'build.gradle', 'settings.gradle', 'gradle.properties'
        exclude 'README.md'
    }
}

preBuild.dependsOn(tasks.named('syncWebAssets'))
