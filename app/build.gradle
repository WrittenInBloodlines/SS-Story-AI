plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ssstoryai.app'
    compileSdk 36
    ndkVersion '29.0.13113456'

    defaultConfig {
        applicationId 'com.ssstoryai.app'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            // This is a local/test release, so use the standard debug keystore
            // to keep the generated APK directly installable without secrets.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('../third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt')
            version '3.31.6'
        }
    }

    sourceSets {
        main {
            java.srcDirs += '../third_party/llama.cpp/examples/llama.android/lib/src/main/java'
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.webkit:webkit:1.12.1'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

// The Android app is a wrapper around the existing S•S Story AI web UI.
// The web files are copied at build time, so there is only one source of truth.
tasks.register('syncWebAssets', Sync) {
    into(layout.projectDirectory.dir('src/main/assets'))
    from(rootProject.projectDir) {
        include '**/*'
        exclude '.git/**', '.github/**', '.gradle/**', 'app/**', 'build/**', 'tools/**', 'third_party/**'
        exclude 'build.gradle', 'settings.gradle', 'gradle.properties'
        exclude 'README.md'
    }
}

preBuild.dependsOn(tasks.named('syncWebAssets'))
