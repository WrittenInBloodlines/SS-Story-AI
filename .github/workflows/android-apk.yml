name: Build S•S Story AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch llama.cpp GGUF runtime
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Enable llama.cpp common library
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/llama.cpp/CMakeLists.txt
          printf '%s\n' 'set(LLAMA_BUILD_COMMON ON CACHE BOOL "Build llama.cpp common library" FORCE)' | cat - third_party/llama.cpp/CMakeLists.txt > /tmp/llama-CMakeLists.txt
          mv /tmp/llama-CMakeLists.txt third_party/llama.cpp/CMakeLists.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        shell: bash
        run: |
          set -euo pipefail

          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Validate project files
        run: python3 tools/validate-project.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-Story-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
