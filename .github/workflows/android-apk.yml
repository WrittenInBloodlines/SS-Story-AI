name: Build S•S Story AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch llama.cpp GGUF runtime
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Patch llama.cpp Android runtime for Gemma 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp')
          text = path.read_text()

          replacements = {
              'constexpr int   N_THREADS_MAX           = 4;':
                  'constexpr int   N_THREADS_MAX           = 8;',
              'constexpr int   N_THREADS_HEADROOM      = 2;':
                  'constexpr int   N_THREADS_HEADROOM      = 1;',
              'constexpr int   DEFAULT_CONTEXT_SIZE    = 8192;':
                  'constexpr int   DEFAULT_CONTEXT_SIZE    = 4096;',
              '/* use_jinja */ false':
                  '/* use_jinja */ true',
              'stop_generation_position = current_position + user_prompt_size + n_predict;':
                  'stop_generation_position = current_position + n_predict;',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected llama.cpp source text: {old}')
              text = text.replace(old, new)

          path.write_text(text)
          print('Patched llama.cpp Android runtime for Gemma 3.')
          PY

      - name: Enable llama.cpp common library
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/llama.cpp/CMakeLists.txt
          printf '%s\n' 'set(LLAMA_BUILD_COMMON ON CACHE BOOL "Build llama.cpp common library" FORCE)' | cat - third_party/llama.cpp/CMakeLists.txt > /tmp/llama-CMakeLists.txt
          mv /tmp/llama-CMakeLists.txt third_party/llama.cpp/CMakeLists.txt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        shell: bash
        run: |
          set -euo pipefail

          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Validate project files
        run: python3 tools/validate-project.py

      - name: Build optimized release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: SS-Story-AI-optimized-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
